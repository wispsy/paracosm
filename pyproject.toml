[project]
name = "paracosm"
version = "0.1.0"
description = "Deterministic worlds and optional environment minds."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = ["thoughtform @ git+https://github.com/wispsy/thoughtform.git@e618ab5e41aee2f04f004e9df3c6a594112d2c8e"]

[project.scripts]
paracosm = "paracosm:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.urls]
Source = "https://github.com/wispsy/paracosm"
Project = "https://github.com/orgs/wispsy/projects/28"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "IMPLEMENTATION_PLAN.md"]
